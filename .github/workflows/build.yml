name: Build BDSMP Custom Menu
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Unpack source
        run: unzip BDSMP-Custom-Menu-1.21.11-source.zip -d mod
      - name: Build mod
        run: gradle -p mod build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bdsmp-custom-menu-1.21.11
          path: mod/build/libs/bdsmp-custom-menu-1.0.0.jar
          if-no-files-found: error
